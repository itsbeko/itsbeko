name: Lézard

on:
  schedule:
    - cron: "0 3 * * *" # tous les jours à 3h UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/lizard.mjs", ".github/workflows/lizard.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Génère le lézard
        run: node scripts/lizard.mjs dist ${{ github.repository_owner }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publie sur la branche output
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Lézard du $(date -u +%F)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
